name: Rebuild published process host RPM for cluster 32
on:
  workflow_dispatch:
    inputs:
      published_runtime:
        description: Base64 of the verified canonical runtime from the original public artifact
        required: true
        type: string
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: rockylinux:9
    steps:
      - name: Install RPM build dependencies
        run: dnf install -y git make rpm-build cpio python3
      - uses: actions/checkout@v4
        with:
          ref: fb4078bdbdbb01ca95c467755a5fb4925f6bf574
          persist-credentials: false
      - name: Rebuild the original package release with the published runtime
        env:
          PUBLISHED_RUNTIME: ${{ inputs.published_runtime }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = fb4078bdbdbb01ca95c467755a5fb4925f6bf574
          printf '%s' "$PUBLISHED_RUNTIME" | base64 -d > /tmp/process-runtime.tar.gz
          echo 'ddcbeebcf7d8d2cd30f278e0c18f09686739acb4abf447ad06b261a3166ac57c  /tmp/process-runtime.tar.gz' | sha256sum -c
          tar -xzf /tmp/process-runtime.tar.gz -C lib/process
          test "$(tr -d '\r\n' < lib/process/SOURCE_COMMIT)" = "$(git rev-parse HEAD)"
          chmod 0755 lib/process/process-*-launcher
          (cd lib/process && sha256sum -c SHA256SUMS)
          make rpm RELEASE=1.epic36834382355
          mkdir -p build/unpack
          (cd build/unpack && rpm2cpio ../rpm/*.rpm | cpio -idm --quiet)
          for name in AbleProcessIdentity.dll AbleProcessAction.dll process-read-launcher process-action-launcher guest_adapter_compat.json; do
            cmp "lib/process/$name" "build/unpack/usr/libexec/ablestack-qemu-exec-tools/process/$name"
          done
          test "$(rpm -qp --qf '%{VERSION} %{RELEASE} %{ARCH}' build/rpm/*.rpm)" = '0.10.0 1.epic36834382355.el9.el9 x86_64'
          (cd build/rpm && sha256sum *.rpm > SHA256SUMS && rpm -qp --dump ./*.rpm | LC_ALL=C sort > FILES.rpm-dump)
          git rev-parse HEAD > build/rpm/SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: process-host-rpm-rebuild
          path: build/rpm/*
          if-no-files-found: error
          retention-days: 14